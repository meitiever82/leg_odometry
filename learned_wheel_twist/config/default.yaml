# learned_wheel_twist 默认配置
data:
  sim_root: ~/Documents/Datasets/w2_sim
  cache_root: ~/Documents/Datasets/w2_sim_cache
  window: 25          # 帧 @50Hz = 0.5s
  wheel_hz: 50
split: {train: 0.8, val: 0.1, test: 0.1, seed: 0}
kappa_aug:
  steer_bias_max_deg: 1.0   # 每轮额外 δ ~ U(±max)
  speed_scale_std: 0.015    # 每轮额外 s ~ N(1, std)
model: {tcn_channels: 48, tcn_layers: 4, kernel: 3, dropout: 0.1}
train: {batch: 256, lr: 1.0e-3, epochs: 60, mse_warmup_epochs: 15, device: cuda, bias_penalty: 1.0}
geom: {wheelbase: 0.435, track: 0.400, wheel_radius: 0.075}
# approach-2 step1 端到端可微长程轨迹损失(--traj-loss 时生效)。
traj:
  segment_sec: 10.0        # 每段时长(~500 帧 @50Hz)→ 让 ~10s 的积分航向漂移进入损失
  stride_sec: 5.0          # 分段步长(<segment_sec 则重叠采样,增样本)
  seg_batch: 8             # 每步并行段数(显存敏感:S×B×W 的 rollout)
  sub_strides: [50, 150, 350]  # RPE 子段跨度(帧):短程局部一致 + 长程累积航向漂移
  yaw_weight: 3.0          # 轨迹损失中 Δyaw 相对 Δxy 的权重
  lambda_pf: 2.0           # 逐帧 twist MSE 正则强度(锚 vx/vy/wz 尺度,防退化/不稳)
  pf_warmup_epochs: 12     # 前 N 轮仅逐帧 MSE 预热,之后启用轨迹损失
  traj_lr_scale: 0.3       # 轨迹损失阶段学习率缩放(rollout 梯度噪声大,降 LR 稳)
# approach-2 step2a:sim 保真增广(--realism 时生效)。把真机域退化注入 SIM 训练输入(仅 14ch data-driven,
# 标签不变)。幅值为真机缓存实测估计(见 lwt/realism.py 注释 + test_report 阶段五-b)。
realism:
  enable: true             # 总开关;--realism 时 train.py 覆盖为 true
  kappa_bulk:              # κ-bulk:把真机 |κ|≈0.04 放到 effective-κ 分布中位(取代旧 κ-aug 尾部)
    enable: true
    kappa_std: 0.04        # per-window 目标 κ ~ N(0, std);real per-session κ −0.035..−0.044
  gyro:                    # 真实陀螺:打破 "sim 陀螺=完美 gt_wz"(实测 sim std 8e-4)
    enable: true
    sigma_bias: 0.003      # per-window 残差偏置(去偏后残留,real wz DC ~−0.006)
    sigma_noise: 0.005     # per-sample 白噪声(real yaw 高频 diff-std ~0.017→σ≈0.005,三轴同)
  bumps:                   # 合成减速带/颠簸:~3% 帧聚成短事件
    enable: true
    event_rate: 0.03       # 命中事件帧占比(real |az-mean|>3σ ~1.1−1.3%,放宽到 3% 覆盖更软的颠簸)
    speed_blip: 0.05       # 轮速 bounce/slip 相对量级
    accel_z: 2.0           # 垂直加速度尖峰(m/s²;real az std 1.0−2.2)
    pitchroll_rate: 0.05   # pitch/roll 角速率尖峰(rad/s;real g_base 轴0/1 std 0.02−0.10)
    event_len_min: 3       # 事件最短帧(@50Hz = 60ms)
    event_len_max: 10      # 事件最长帧(@50Hz = 200ms)
  accel_noise:             # 加速度小白噪声(避免 accel 不真实地干净)
    enable: true
    sigma: 0.05
# 阶段六:真机激光监督 fine-tune(留一法)。
# Step A —— sim 预训练时仅对**轮速通道**(0-7:steer4+speed4)注入小高斯输入噪声(IMU 通道不动,
# 因阶段五-b 已证「给陀螺加噪 → wz 偏置回潮」)。让模型对轮速标定/读数扰动鲁棒,而保留陀螺为可信 wz 源。
# 与 realism/κ-aug 正交:--wheel-noise 时启用,默认幅值取真机量级(speed ~1.5% 典型速、steer ~0.3°)。
pretrain:
  wheel_noise_std:
    enable: true
    speed_std: 0.01        # m/s:per-sample 白噪声叠加到 4 路轮速(典型速 ~0.5-1 m/s → ~1-2%)
    steer_std_deg: 0.3     # deg:per-sample 白噪声叠加到 4 路转向角(读数抖动量级)
# Step C —— 真机激光监督 fine-tune(LOO)。低 LR、少 epoch、轨迹损失对齐激光 TUM;
# L2-to-pretrained 锚正则防只 2 个训练 bag 过拟合。
finetune:
  lr: 1.0e-4               # 低 LR(gentle,防把预训练结构推翻)
  epochs: 10              # 少 epoch(gentle,disp_weight 强锚下 8-10 即收敛)
  segment_sec: 10.0        # ~10s 段(窗末采样)做长程 RPE
  stride_sec: 5.0          # 段重叠步长
  seg_batch: 4             # 每步并行段数(真机段 S 大,显存敏感)
  sub_strides: [50, 150, 350]  # RPE 子段跨度(帧 @50Hz):短程一致 + 长程暴露 wz 偏置
  yaw_weight: 3.0          # Δyaw 相对 Δxy 权重
  disp_weight: 6.0         # 绝对位移尺度锚权重(防 vx 塌缩退化解,见 lidar_loss._disp_scale_anchor)
  l2_anchor: 1.0e-3        # L2-to-pretrained-weights 锚(防 2-bag 过拟合)
  grad_clip: 5.0

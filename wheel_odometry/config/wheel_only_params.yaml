wheel_only_odom:
  ros__parameters:
    # ---- Geometry — calibrate per platform ----
    wheelbase:    0.435   # L, front-to-rear distance between wheel contact points (m)
    track:        0.400   # W, left-to-right distance (m)
    # Multiplier on velocity field in /robot/wheel_status (sensor_msgs/JointState).
    wheel_radius: 1.0  # in-fact, it is not used

    # ---- IMU ----
    # enable_imu=true uses the IMU gyro for yaw (yaw_source=gyro below). On this
    # platform the IMU is mounted ~58 deg tilted, so the node's accel-based mount
    # calibration (R_base_imu) projects the gyro onto vertical — handled
    # automatically, no extrinsic config needed. Validated on bag
    # 2026-05-22-13_58_40: gyro yaw cut APE 10.96 -> 0.34 m vs GLIM.
    # Set false only for a bag with no IMU (then yaw is forced to LS, ~37%
    # under-estimated while driving — see project memory).
    enable_imu:      true
    bias_window_sec: 3.0
    tilt_kp:         1.0
    tilt_accel_band: 0.5

    # ---- Yaw policy ----
    # "ls":   ω_z from the 8×3 LS solve (only valid when enable_imu=false or
    #         when geometry calibration is trusted; drift-free in principle).
    # "gyro": ω_z from IMU after auto-mount calibration (requires enable_imu=true).
    #         Strongly preferred when an IMU is present — pure-wheel LS yaw is
    #         slip-limited (~0.69 net-ratio while driving); gyro gets ~0.99.
    yaw_source:    "gyro"
    # Residual is in m/s. /robot/wheel_status.velocity is already m/s on this
    # platform (firmware does ω·r internally), so wheel_radius does not enter
    # the LS — keep slip_threshold an absolute m/s value, ~0.5 is comfortable
    # margin above observed clean-data residuals (max ~0.14 m/s).
    slip_threshold: 0.1

    # ---- Chassis stream gating ----
    # Max chassis stamp dt (s) the node will still integrate. Larger gaps drop
    # the tick (no odom that cycle). /robot/wheel_status is bursty on this
    # platform — it stalls then dumps a batch; observed worst gap ~1.0 s (bag
    # 2026-05-14 and on-robot). 1.2 covers it so real motion is integrated, not
    # lost. Watch the [diag] summary's "dt>..s" counter to tune.
    max_dt: 1.2

    # ---- FlatZ clamp on p.z (flat-floor prior) ----
    flatz_enabled: true
    flatz_alpha:   0.05

    # ---- ROS output ----
    publish_tf:    true
    odom_frame:    "odom"
    base_frame:    "base_link_wheel_odom"
    odom_topic:    "/wheel_odometry"
    chassis_topic: "/robot/wheel_status"
    imu_topic:     "/rslidar_imu_data"   # IMU embedded in the RS-LiDAR

    # Empty string disables CSV logging — leave empty; live PNG is produced
    # by the trajectory_plotter node spawned from the launch file.
    diag_csv_path: "/tmp/wheel_odom.csv"
